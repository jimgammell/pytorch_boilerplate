default_model_config:
  input_channel_count: 3
  input_dim: 256
  output_dim: 10
  base_patch_dim: 16
  use_conv_stem: true
  embedding_dim: 768
  mlp_dim: 3072
  transformer_layer_count: 12
  attn_head_count: 12
  bias: true
  dropout: 0.1
  train_prior_prob: 0.05
  gumbel_tau: 1.0
  eps: 1.e-5
  max_sequence_length: null # all possible patches will be used
default_training_config:
  training_steps: 6700
  base_lr: 1.e-4
  lr_scheduler_name: cosine_decay
  lr_scheduler_kwargs:
    warmup_steps: 500
    const_steps: 0
    final_lr_prop: 0.0
  beta_1: 0.9
  beta_2: 0.95
  eps: 1.e-8
  weight_decay: 0.05
  grad_clip: 1.0
  dtype: bf16-mixed
  use_mixup_and_cutmix: true
  compile: true
  pretrain: true
datamodule_config:
  val_prop: 0.1
  train_batch_size: 256
  eval_batch_size: 2048
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 1
dataset_config:
  dim: 256