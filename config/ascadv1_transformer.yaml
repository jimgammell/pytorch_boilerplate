default_model_config:
  patch_size: 1000
  layer_count: 3
  attn_head_count: 12
  embedding_dim: 768
  dropout: 0.0
  bias: true
  norm_eps: 1.e-5
  rescale_norm_outputs: false
  output_head_count: 16
  output_head_classes: 256
default_training_config:
  training_steps: 5000
  base_lr: 1.e-3
  lr_scheduler_name: cosine_decay
  lr_scheduler_kwargs:
    warmup_steps: 500
    const_steps: 4500
  beta_1: 0.9
  beta_2: 0.99
  eps: 1.e-8
  weight_decay: 0.0
  grad_clip: 1.0
  dtype: bf16-mixed
  compile: false
datamodule_config:
  val_prop: 0.1
  train_batch_size: 512
  eval_batch_size: 512
  num_workers: null # detect automatically
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 4
dataset_config:
  target: unprotected
  store_in_ram: false